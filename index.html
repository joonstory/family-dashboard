<style>
:root{
  --ink:#2F2A22;
  --muted:#8A7E6D;
  --line:#EADFCB;
  --cream:#FFF9EE;
  --yellow:#FFD93B;
  --red:#FF5A5F;
  --green:#2E9E6B;
  --card-radius:24px;
  --shadow:0 10px 24px rgba(126,96,44,.10);
  --shadow-sm:0 3px 10px rgba(126,96,44,.09);
  --font-title:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--cream);
  background-image:
    radial-gradient(circle at 12% 4%, #FFF3C0 0%, rgba(255,243,192,0) 42%),
    radial-gradient(circle at 92% 16%, #DFF3EE 0%, rgba(223,243,238,0) 38%),
    radial-gradient(circle at 50% 100%, #FFE6E6 0%, rgba(255,230,230,0) 46%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}

/* ---------- header ---------- */
.app-header{
  position:sticky;top:0;z-index:30;
  padding:calc(10px + env(safe-area-inset-top)) 0 10px;
  background:linear-gradient(180deg,rgba(255,249,238,.97) 62%,rgba(255,249,238,.72) 88%,rgba(255,249,238,0));
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
h1{
  font-family:var(--font-title);
  font-size:17.5px;line-height:1.24;margin:0;font-weight:400;
  letter-spacing:-.35px;
  flex:1 1 auto;min-width:0;
}
h1 .bolt{color:#F2B705}
.sync-badge{
  display:inline-flex;align-items:center;gap:5px;flex:none;
  font-size:11.5px;font-weight:700;color:#2E7D5B;
  background:#E6F6EC;border:1px solid #C6EBD6;border-radius:999px;
  padding:5px 9px;white-space:nowrap;
}
.sync-badge .dot{width:7px;height:7px;border-radius:50%;background:#35C46B;box-shadow:0 0 0 0 rgba(53,196,107,.6);animation:pulse 2s infinite}
.sync-badge.off{color:#9A6B12;background:#FFF4DC;border-color:#F6E0B0}
.sync-badge.off .dot{background:#F0A93B;animation:none}
.sync-badge.err{color:#B23A3A;background:#FDE9E9;border-color:#F7C9C9}
.sync-badge.err .dot{background:#E04B4B;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(53,196,107,.55)}70%{box-shadow:0 0 0 6px rgba(53,196,107,0)}100%{box-shadow:0 0 0 0 rgba(53,196,107,0)}}

.summary{
  background:#fff;border:1.5px solid var(--line);border-radius:18px;
  padding:11px 14px;box-shadow:var(--shadow-sm);
}
.summary-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.summary-main{font-family:var(--font-title);font-size:15px;color:#43382A}
.summary-main b{color:#E08A00;font-size:17px}
.summary-note{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.summary-bar{height:8px;border-radius:999px;background:#F3EBDD;margin-top:8px;overflow:hidden}
.summary-bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#FFD93B,#FFB627);transition:width .45s cubic-bezier(.3,1.2,.4,1)}
.summary.all-done{background:linear-gradient(135deg,#FFF8D6,#FFF0B8);border-color:#F5D96A}

/* ---------- cards ---------- */
#board{margin-top:14px;display:flex;flex-direction:column;gap:14px}
.card{
  position:relative;
  border-radius:var(--card-radius);
  padding:13px 13px 12px;
  border:1.5px solid rgba(120,96,60,.13);
  box-shadow:var(--shadow);
  animation:rise .45s cubic-bezier(.2,.9,.3,1) both;
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;right:-26px;top:-30px;width:110px;height:110px;border-radius:50%;
  background:rgba(255,255,255,.45);pointer-events:none;
}
.card.korean{background:linear-gradient(160deg,#FFFBDF,#FFF0AE)}
.card.science{background:linear-gradient(160deg,#E9F8E3,#D1EFC7)}
.card.social{background:linear-gradient(160deg,#E6F3FC,#CDE7F8)}
.card.moral{background:linear-gradient(160deg,#FDF1E0,#F8DFC0)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card-head{display:flex;align-items:center;gap:10px;position:relative}
.avatar{
  width:52px;height:52px;flex:none;border-radius:50%;
  background:rgba(255,255,255,.72);
  border:2px solid rgba(255,255,255,.9);
  box-shadow:0 3px 8px rgba(120,96,60,.12);
  display:grid;place-items:center;
}
.avatar svg{width:44px;height:44px;display:block}
.who{min-width:0;flex:1}
.who .name{font-family:var(--font-title);font-size:18px;line-height:1.15;color:#3B3125;display:flex;align-items:center;gap:6px}
.who .tag{
  font-size:11.5px;color:#6F6455;margin-top:3px;font-weight:700;
  display:inline-flex;align-items:center;gap:3px;max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:rgba(255,255,255,.72);border-radius:999px;padding:2px 9px 2px 7px;
}
.who .tag svg{width:12px;height:12px;flex:none;display:block;opacity:.7}
.trophy{
  font-size:10.5px;font-weight:800;color:#8A5B00;background:#FFE9A8;
  border-radius:999px;padding:2px 7px;flex:none;
}
.progress{text-align:right;flex:none}
.progress .num{font-family:var(--font-title);font-size:14px;color:#4A4034;white-space:nowrap}
.progress .num b{font-size:17px;color:#2F2A22}
.card-bar{height:7px;border-radius:999px;background:rgba(255,255,255,.75);margin:10px 0 4px;overflow:hidden}
.card-bar i{display:block;height:100%;width:0;border-radius:999px;transition:width .45s cubic-bezier(.3,1.2,.4,1)}
.card.korean .card-bar i{background:linear-gradient(90deg,#FFD93B,#F0A800)}
.card.science .card-bar i{background:linear-gradient(90deg,#8FD873,#3E9E4E)}
.card.social .card-bar i{background:linear-gradient(90deg,#7ECBEA,#2E7FA0)}
.card.moral .card-bar i{background:linear-gradient(90deg,#E5AE70,#B87A46)}

/* ---------- items ---------- */
.items{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.item{
  display:flex;align-items:flex-start;gap:9px;
  background:rgba(255,255,255,.82);
  border:1px solid rgba(255,255,255,.9);
  border-radius:15px;padding:9px 9px 9px 10px;
  box-shadow:0 1px 4px rgba(120,96,60,.06);
  transition:background .2s,opacity .2s;
}
.item.done{background:rgba(255,255,255,.55)}
.check{
  width:30px;height:30px;flex:none;border:0;background:none;padding:0;cursor:pointer;
  display:grid;place-items:center;border-radius:50%;
  transition:transform .15s;
}
.check:active{transform:scale(.86)}
.check svg{width:26px;height:26px;display:block}
.item-text{
  flex:1;min-width:0;font-size:14px;line-height:1.42;color:#332D24;
  word-break:keep-all;overflow-wrap:anywhere;padding-top:4px;
  transition:color .2s,opacity .2s;
}
.item.done .item-text{color:#948A7C;text-decoration:line-through;text-decoration-thickness:1.6px;text-decoration-color:#C3B6A2;opacity:.85}
.item-actions{display:flex;gap:2px;flex:none;padding-top:2px}
.icon-btn{
  width:28px;height:28px;flex:none;border:0;background:none;border-radius:9px;
  font-size:13px;line-height:1;color:#8B8072;cursor:pointer;display:grid;place-items:center;
  transition:background .15s,color .15s;
}
.icon-btn:hover{background:rgba(120,96,60,.09)}
.icon-btn svg{width:16px;height:16px;display:block}
.icon-btn.del{color:#B5A48C}
.icon-btn.del svg{width:15px;height:15px}
.item.confirming{background:#FDEDED;border-color:#F6D2D2}
.confirm-btn{
  flex:none;border:0;border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:800;
  font-family:var(--font-body);background:#FF5A5F;color:#fff;cursor:pointer;
}
.confirm-cancel{
  flex:none;border:0;border-radius:10px;padding:7px 9px;font-size:12.5px;font-weight:700;
  background:rgba(255,255,255,.9);color:#7E7364;cursor:pointer;
}

/* inline editor / adder */
.edit-row{display:flex;gap:6px;align-items:center;width:100%;flex:1 1 auto;min-width:0}
.edit-row input{
  flex:1;min-width:0;font-family:var(--font-body);font-size:14px;color:#2F2A22;
  border:1.5px solid #E2D5BE;border-radius:11px;padding:8px 10px;background:#fff;outline:none;
}
.edit-row input:focus{border-color:#FFC83D;box-shadow:0 0 0 3px rgba(255,200,61,.25)}
.mini-btn{
  flex:none;border:0;border-radius:11px;padding:8px 11px;font-size:12.5px;font-weight:800;
  font-family:var(--font-body);cursor:pointer;
}
.mini-btn.save{background:#2F2A22;color:#fff}
.mini-btn.cancel{background:rgba(255,255,255,.9);color:#7E7364;border:1px solid #E7DCC7}

.add-btn{
  width:100%;margin-top:9px;border:1.7px dashed rgba(120,96,60,.32);background:rgba(255,255,255,.5);
  border-radius:14px;padding:10px;font-family:var(--font-title);font-size:14px;color:#6C6151;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s,border-color .15s;
}
.add-btn:hover{background:rgba(255,255,255,.85);border-color:rgba(120,96,60,.5)}
.add-btn .plus{font-size:16px;line-height:1}
.empty{
  text-align:center;font-size:12.5px;color:#8B8072;padding:12px 6px 8px;line-height:1.6;
}

/* ---------- footer ---------- */
.foot{margin-top:18px;text-align:center;font-size:11px;color:#A99C88;line-height:1.7}
.foot .ball{display:inline-block;transform:translateY(1px)}

/* ---------- celebration banner ---------- */
#banner{
  position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top));
  transform:translate(-50%,-170%);
  width:min(94vw,470px);z-index:80;
  background:linear-gradient(120deg,#FFE86B,#FFC93C 55%,#FFD95E);
  border:2px solid #fff;border-radius:18px;
  box-shadow:0 12px 26px rgba(190,140,0,.28);
  padding:11px 15px;text-align:center;
  font-family:var(--font-title);font-size:15px;color:#4A3400;
  transition:transform .42s cubic-bezier(.2,1.5,.4,1);
  pointer-events:none;
}
#banner.show{transform:translate(-50%,0)}
#banner .spark{position:absolute;font-size:12px;opacity:0;animation:twinkle 1.1s ease-in-out infinite}
#banner .s1{left:8px;top:2px;animation-delay:0s}
#banner .s2{right:9px;top:4px;animation-delay:.35s}
#banner .s3{right:34px;bottom:-2px;animation-delay:.7s}
#banner .s4{left:32px;bottom:-3px;animation-delay:.5s}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.6)}45%{opacity:1;transform:scale(1.15)}}

/* ---------- hi-five popup ---------- */
#hifive{
  position:fixed;inset:0;z-index:70;display:grid;place-items:center;
  background:rgba(48,34,10,.34);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
#hifive.show{opacity:1;pointer-events:auto}
.hifive-card{
  position:relative;width:min(78vw,300px);
  background:radial-gradient(circle at 50% 0%,#FFFDF2,#FFF6D9 70%);
  border:3px solid #fff;border-radius:30px;
  padding:20px 18px 16px;text-align:center;
  box-shadow:0 20px 44px rgba(60,40,0,.30);
  transform:scale(.82);transition:transform .3s cubic-bezier(.2,1.5,.4,1);
}
#hifive.show .hifive-card{transform:scale(1)}
.hifive-char{
  width:104px;height:104px;margin:0 auto 6px;
  animation:hop .56s cubic-bezier(.3,1.4,.5,1) infinite alternate;
}
.hifive-char svg{width:100%;height:100%;display:block}
@keyframes hop{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-10px) rotate(4deg)}}
.hifive-msg{font-family:var(--font-title);font-size:26px;color:#3A2E12;margin:2px 0 0;letter-spacing:-.3px}
.hifive-sub{font-size:12px;color:#9A8A66;margin-top:7px}
.hifive-ring{position:absolute;inset:-14px;pointer-events:none}
.ring-star{position:absolute;font-size:16px;animation:popStar 1.3s ease-in-out infinite}
.ring-star.a{left:-4px;top:18%}
.ring-star.b{right:2px;top:8%;animation-delay:.2s}
.ring-star.c{right:10%;bottom:12%;animation-delay:.45s}
.ring-star.d{left:6%;bottom:16%;animation-delay:.65s}
@keyframes popStar{0%,100%{opacity:0;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(18deg)}}

.loading{text-align:center;color:#9A8E7C;font-size:13px;padding:26px 0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

@media (max-width:360px){
  h1{font-size:16px}
  .sync-badge{font-size:10.5px;padding:4px 7px}
  .avatar{width:46px;height:46px}
  .avatar svg{width:39px;height:39px}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue, set, update, push, remove }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

/* ------------------------------------------------------------------ */
/*  설정                                                               */
/* ------------------------------------------------------------------ */
const firebaseConfig = {
  apiKey: "AIzaSyBvYAgtN_RL0qiSc4dyCznyx3G8iFKLyo0",
  authDomain: "family-dashboard-72c64.firebaseapp.com",
  databaseURL: "https://family-dashboard-72c64-default-rtdb.firebaseio.com",
  projectId: "family-dashboard-72c64",
  storageBucket: "family-dashboard-72c64.firebasestorage.app",
  messagingSenderId: "471246003291",
  appId: "1:471246003291:web:f600815902f2c5c6c1737e"
};

const DB_ROOT = "family_board/v2";          // 기말고사 개편 전용 경로(v1 데이터와 분리)
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const rootRef = ref(db, DB_ROOT);

/* 4과목 정의 (부제 = 시험 일시) */
const SUBJECTS = [
  { id:"korean",  name:"국어", cls:"korean",  exam:"12/7(월) 1교시" },
  { id:"science", name:"과학", cls:"science", exam:"12/7(월) 2교시" },
  { id:"social",  name:"사회", cls:"social",  exam:"12/8(화) 1교시" },
  { id:"moral",   name:"도덕", cls:"moral",   exam:"12/9(수) 2교시" }
];

/* 첫 시드 데이터 — 시험 범위표 사진 기준 과목별 소단위 체크리스트 */
const SEED_ITEMS = {
  korean: [
    "동백꽃 (P.14~P.36)",
    "토의하기 (P.46~P.57)",
    "단어의 짜임과 새말 (P.114~P.133)",
    "학습지"
  ],
  science: [
    "II. 생물의 구성과 다양성 (P.38~P.77)",
    "과학 B 학습지 (①~⑧)",
    "VII. 태양계 (P.228~P.261)",
    "과학 학습지 (28~35)"
  ],
  social: [
    "VIII. 다양한 문화의 이해 (P.146~P.161)",
    "XI. 일상생활과 법 (P.202~P.217)",
    "XII. 인권과 기본권 (P.220~P.237)"
  ],
  moral: [
    "II-3. 가상공간에서 타인을 어떻게 대해야 할까? ~ IV. 자연과의 관계 (P.100~P.195)",
    "학습지"
  ]
};

function buildSeed(){
  const subjects = {};
  for (const s of SUBJECTS){
    const items = {};
    (SEED_ITEMS[s.id] || []).forEach((text, i) => {
      items[s.id + "-" + (i + 1)] = { text, done:false, order: i + 1 };
    });
    subjects[s.id] = { name: s.name, exam: s.exam, items };
  }
  return {
    meta: { initialized: true, version: 2, seededFor: "2026-2학기 기말고사", examPeriod: "12.7~12.9", createdAt: 1770000000000 },
    subjects
  };
}

/* ------------------------------------------------------------------ */
/*  상태                                                               */
/* ------------------------------------------------------------------ */
const ui = {
  data: null,
  ready: false,
  connected: false,
  error: null,
  seeded: false,
  editing: null,      // { mid, iid, value }
  adding: null,       // mid
  addValue: "",
  pendingDelete: null,// "mid/iid"
  dirty: false
};

const $ = (id) => document.getElementById(id);
const board      = $("board");
const syncBadge  = $("sync");
const syncText   = $("sync-text");
const banner     = $("banner");

/* ------------------------------------------------------------------ */
/*  렌더링                                                             */
/* ------------------------------------------------------------------ */
function subjectsOf(data){
  return (data && data.subjects) || {};
}

function sortedItems(data, mid){
  const raw = (subjectsOf(data)[mid] || {}).items || {};
  return Object.entries(raw)
    .map(([id, it]) => ({ id, text: String(it && it.text != null ? it.text : ""), done: !!(it && it.done), order: Number(it && it.order) || 0 }))
    .sort((a, b) => (a.order - b.order) || a.text.localeCompare(b.text));
}

function checkSvg(done){
  if (done){
    return `<svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="10.6" fill="#fff" stroke="#2F2A22" stroke-width="1.7"/>
      <path d="M1.4 12 a10.6 10.6 0 0 1 21.2 0 z" fill="#FF5A5F"/>
      <path d="M1.4 12 h21.2" stroke="#2F2A22" stroke-width="1.7"/>
      <circle cx="12" cy="12" r="4.4" fill="#fff" stroke="#2F2A22" stroke-width="1.5"/>
      <path d="M9.7 12.1 l1.6 1.6 3.1 -3.3" stroke="#2E9E6B" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }
  return `<svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="10" fill="#fff" stroke="#CFC3B2" stroke-width="2" stroke-dasharray="3.2 3.2" stroke-linecap="round"/>
  </svg>`;
}

function editorRow(kind, mid, iid, value){
  return `<div class="edit-row">
    <input type="text" data-editor data-kind="${kind}" data-mid="${mid}" ${iid ? `data-iid="${esc(iid)}"` : ""}
      value="${esc(value || "")}" placeholder="${kind === "add" ? "할 일을 입력해 주세요" : "수정할 내용"}" enterkeyhint="done"
      maxlength="120" autocomplete="off" aria-label="${kind === "add" ? "새 할 일" : "할 일 수정"}">
    <button type="button" class="mini-btn save" data-action="${kind === "add" ? "add-save" : "edit-save"}" data-mid="${mid}" ${iid ? `data-iid="${esc(iid)}"` : ""}>저장</button>
    <button type="button" class="mini-btn cancel" data-action="${kind === "add" ? "add-cancel" : "edit-cancel"}">취소</button>
  </div>`;
}

function itemHTML(m, it){
  const editing = ui.editing && ui.editing.mid === m.id && ui.editing.iid === it.id;
  const confirming = ui.pendingDelete === m.id + "/" + it.id;

  if (editing){
    return `<li class="item">${editorRow("edit", m.id, it.id, ui.editing.value)}</li>`;
  }
  if (confirming){
    return `<li class="item confirming" data-key="${esc(it.id)}">
      <span class="item-text">이 할 일을 지울까요?</span>
      <button type="button" class="confirm-btn" data-action="del-yes" data-mid="${m.id}" data-iid="${esc(it.id)}">삭제</button>
      <button type="button" class="confirm-cancel" data-action="del-no" data-mid="${m.id}" data-iid="${esc(it.id)}">취소</button>
    </li>`;
  }
  return `<li class="item${it.done ? " done" : ""}" data-key="${esc(it.id)}">
    <button type="button" class="check" data-action="toggle" data-mid="${m.id}" data-iid="${esc(it.id)}"
      role="checkbox" aria-checked="${it.done}" aria-label="${esc(it.text)} ${it.done ? "완료 취소" : "완료 체크"}">${checkSvg(it.done)}</button>
    <span class="item-text">${esc(it.text)}</span>
    <span class="item-actions">
      <button type="button" class="icon-btn" data-action="edit" data-mid="${m.id}" data-iid="${esc(it.id)}" aria-label="수정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20.5l4.2-.9L20 7.8a2.6 2.6 0 0 0-3.7-3.7L4.9 15.9 4 20.5z"/><path d="M14.6 5.8l3.6 3.6"/></svg>
      </button>
      <button type="button" class="icon-btn del" data-action="del" data-mid="${m.id}" data-iid="${esc(it.id)}" aria-label="삭제">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
    </span>
  </li>`;
}

function cardHTML(m, items, doneCount){
  const total = items.length;
  const pct = total ? Math.round(doneCount / total * 100) : 0;
  const allDone = total > 0 && doneCount === total;
  const adding = ui.adding === m.id;

  const body = items.map(it => itemHTML(m, it)).join("");
  const list = total
    ? `<ul class="items">${body}${adding ? `<li class="item">${editorRow("add", m.id, null, ui.addValue || "")}</li>` : ""}</ul>`
    : (adding
        ? `<ul class="items"><li class="item">${editorRow("add", m.id, null, ui.addValue || "")}</li></ul>`
        : `<p class="empty">아직 할 일이 없어요.<br>아래 버튼으로 하나 추가해 볼까요?</p>`);

  return `<section class="card ${m.cls}" data-mid="${m.id}" aria-label="${m.name} 시험 범위 할 일">
    <div class="card-head">
      <div class="avatar">${CHARS[m.id]}</div>
      <div class="who">
        <div class="name">${m.name}${allDone ? `<span class="trophy">🏆 완료!</span>` : ""}</div>
        <span class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.4v5l3 1.9"/></svg>${m.exam}</span>
      </div>
      <div class="progress"><div class="num"><b>${doneCount}</b>/${total}개 완료</div></div>
    </div>
    <div class="card-bar" role="img" aria-label="${m.name} 진행률 ${pct}%"><i style="width:${pct}%"></i></div>
    ${list}
    ${adding ? "" : `<button type="button" class="add-btn" data-action="add" data-mid="${m.id}"><span class="plus">＋</span> ${m.name} 할 일 추가</button>`}
  </section>`;
}

/* 추가 입력 중이던 값은 새 입력창에도 이어지게 합니다. */
function render(){
  if (!ui.ready) return;
  const data = ui.data;
  let totalAll = 0, doneAll = 0;

  // 편집 중이던 입력값을 잃지 않도록 DOM의 최신 값을 보관합니다.
  const liveInput = board.querySelector("[data-editor]");
  if (liveInput){
    if (liveInput.dataset.kind === "edit" && ui.editing) ui.editing.value = liveInput.value;
    if (liveInput.dataset.kind === "add") ui.addValue = liveInput.value;
  }
  // 다른 기기에서 지워진 항목을 편집 중이었다면 편집 상태를 정리합니다.
  if (ui.editing && !sortedItems(data, ui.editing.mid).some(i => i.id === ui.editing.iid)){
    ui.editing = null;
  }

  const html = SUBJECTS.map(m => {
    const items = sortedItems(data, m.id);
    const done = items.filter(i => i.done).length;
    totalAll += items.length; doneAll += done;
    return cardHTML(m, items, done);
  }).join("");

  board.innerHTML = html;

  const pct = totalAll ? Math.round(doneAll / totalAll * 100) : 0;
  const left = totalAll - doneAll;
  if (totalAll === 0){
    summaryMain.textContent = "과목별 할 일을 추가해 보세요";
    summaryNote.textContent = "(12.7~12.9)";
  } else if (left === 0){
    summaryMain.innerHTML = `기말고사 전체 <b>${doneAll}/${totalAll}</b> 완료 🏆`;
    summaryNote.textContent = "12.7~12.9 시험 대비 끝!";
  } else {
    summaryMain.innerHTML = `기말고사 전체 <b>${doneAll}/${totalAll}</b> 완료`;
    summaryNote.textContent = "(12.7~12.9)";
  }
  summaryFill.style.width = pct + "%";
  summaryEl.classList.toggle("all-done", totalAll > 0 && left === 0);

  // 입력 중이던 편집기는 포커스와 커서를 되살립니다.
  const editor = board.querySelector("[data-editor]");
  if (editor){
    editor.focus();
    const v = editor.value;
    try { editor.setSelectionRange(v.length, v.length); } catch (e) {}
  }
}

/* ------------------------------------------------------------------ */
/*  축하 인터랙션                                                       */
/* ------------------------------------------------------------------ */
let bannerTimer = null, hifiveTimer = null;

function celebrate(mid, text){
  const short = text.length > 26 ? text.slice(0, 25) + "…" : text;
  banner.innerHTML = `<span class="spark s1">✨</span><span class="spark s2">⭐</span>
    <span class="spark s3">✨</span><span class="spark s4">💫</span>
    나이스! ✨ '${esc(short)}' 잡았다!`;
  banner.classList.add("show");
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => banner.classList.remove("show"), 2800);

  hifiveChar.innerHTML = CHARS[mid] || CHARS.korean;
  hifive.classList.add("show");
  clearTimeout(hifiveTimer);
  hifiveTimer = setTimeout(closeHifive, 2200);
}

function closeHifive(){
  hifive.classList.remove("show");
  clearTimeout(hifiveTimer);
}

hifive.addEventListener("click", closeHifive);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape"){
    if (hifive.classList.contains("show")) closeHifive();
    if (ui.editing || ui.adding){ ui.editing = null; ui.adding = null; ui.addValue = ""; render(); }
    if (ui.pendingDelete){ ui.pendingDelete = null; render(); }
  }
});

/* ------------------------------------------------------------------ */
/*  동기화 상태                                                        */
/* ------------------------------------------------------------------ */
function setSync(state, msg){
  syncBadge.classList.remove("off", "err");
  if (state === "on"){
    syncText.textContent = "실시간 동기화";
  } else if (state === "err"){
    syncBadge.classList.add("err");
    syncText.textContent = msg || "동기화 오류";
  } else {
    syncBadge.classList.add("off");
    syncText.textContent = msg || "연결 중…";
  }
}

onValue(ref(db, ".info/connected"), (snap) => {
  ui.connected = snap.val() === true;
  if (!ui.error) setSync(ui.connected ? "on" : "off");
});

function readError(err){
  ui.error = err;
  setSync("err", "동기화 오류");
  console.error("[family-board]", err);
}

/* ------------------------------------------------------------------ */
/*  실시간 구독 + 1회 시드                                              */
/* ------------------------------------------------------------------ */
onValue(rootRef, async (snapshot) => {
  let val = snapshot.val();

  // DB가 완전히 비었을 때만, 딱 한 번 기본 데이터를 넣습니다.
  // meta 노드가 함께 저장되므로 사용자가 항목을 모두 지워도 root가 null이 되지 않습니다.
  if (val === null && !ui.seeded){
    ui.seeded = true;
    try {
      await set(rootRef, buildSeed());
      return; // set()의 결과가 onValue로 다시 들어옵니다.
    } catch (err){
      readError(err);
    }
  }

  ui.data = val || {};
  ui.ready = true;
  ui.error = null;
  if (!ui.editing && !ui.adding) render();
  else ui.dirty = true;
}, (err) => {
  ui.ready = true;
  readError(err);
  board.innerHTML = `<div class="loading">보드를 불러오지 못했어요.<br>잠시 후 새로고침해 주세요.</div>`;
});

/* ------------------------------------------------------------------ */
function findItem(mid, iid){
  return sortedItems(ui.data, mid).find(i => i.id === iid);
}

function localToggle(mid, iid, next){
  const node = (((ui.data || {}).subjects || {})[mid] || {}).items || {};
  if (node[iid]) node[iid].done = next;
}

function finishEdit(){
  ui.editing = null; ui.adding = null; ui.addValue = ""; ui.pendingDelete = null;
  render();
}

board.addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  const mid = btn.dataset.mid;
  const iid = btn.dataset.iid;

  if (action === "toggle"){
    const item = findItem(mid, iid);
    if (!item) return;
    const next = !item.done;
    localToggle(mid, iid, next);
    render();
    if (next) celebrate(mid, item.text);
    try {
      await update(ref(db, itemPath(mid, iid)), { done: next, updatedAt: Date.now() });
      ui.error = null; setSync(ui.connected ? "on" : "off");
    } catch (err){
      localToggle(mid, iid, !next);
      render();
      readError(err);
      toastBanner("저장에 실패했어요. 잠시 후 다시 시도해 주세요.");
    }
    return;
  }

  if (action === "edit"){
    const item = findItem(mid, iid);
    if (!item) return;
    ui.pendingDelete = null;
    ui.adding = null;
    ui.editing = { mid, iid, value: item.text };
    render();
    return;
  }

  if (action === "edit-cancel"){ finishEdit(); return; }

  if (action === "edit-save"){
    const input = board.querySelector("[data-editor]");
    const text = (input ? input.value : "").trim();
    const target = ui.editing;
    if (!target) return;
    if (!text){ input && input.focus(); return; }
    ui.editing = null;
    try {
      await update(ref(db, itemPath(target.mid, target.iid)), { text, updatedAt: Date.now() });
    } catch (err){ readError(err); toastBanner("수정을 저장하지 못했어요."); }
    render();
    return;
  }

  if (action === "del"){
    ui.pendingDelete = mid + "/" + iid;
    ui.editing = null;
    render();
    return;
  }

  if (action === "del-no"){
    ui.pendingDelete = null;
    render();
    return;
  }

  if (action === "del-yes"){
    ui.pendingDelete = null;
    try {
      await remove(ref(db, itemPath(mid, iid)));
    } catch (err){ readError(err); toastBanner("삭제하지 못했어요."); }
    render();
    return;
  }

  if (action === "add"){
    ui.editing = null;
    ui.pendingDelete = null;
    ui.addValue = "";
    ui.adding = mid;
    render();
    return;
  }

  if (action === "add-cancel"){ finishEdit(); return; }

  if (action === "add-save"){
    const input = board.querySelector("[data-editor]");
    const text = (input ? input.value : "").trim();
    if (!text){ input && input.focus(); return; }
    if (text.length > 120) return;
    const items = sortedItems(ui.data, mid);
    const nextOrder = items.reduce((mx, it) => Math.max(mx, it.order), 0) + 1;
    ui.adding = null;
    ui.addValue = "";
    try {
      const newRef = push(ref(db, itemsPath(mid)));
      await set(newRef, { text, done: false, order: nextOrder, createdAt: Date.now() });
    } catch (err){ readError(err); toastBanner("추가하지 못했어요."); }
    render();
    return;
  }
});

board.addEventListener("keydown", (e) => {
  if (!e.target.matches("[data-editor]")) return;
  if (e.key === "Enter"){
    e.preventDefault();
    const kind = e.target.dataset.kind;
    const selector = kind === "add" ? '[data-action="add-save"]' : '[data-action="edit-save"]';
    const saveBtn = board.querySelector(selector);
    if (saveBtn) saveBtn.click();
  }
});

/* 편집 중에는 실시간 갱신을 잠시 보류합니다(입력 내용 보호). */
function flushIfNeeded(){
  if (ui.dirty && !ui.editing && !ui.adding){
    ui.dirty = false;
    render();
  }
}
setInterval(flushIfNeeded, 700);

/* 오류 안내용 임시 배너 */
function toastBanner(msg){
  banner.textContent = msg;
  banner.classList.add("show");
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => banner.classList.remove("show"), 2600);
}

/* 첫 렌더 준비 */
setSync("off");
</script>
</body>
</html>
